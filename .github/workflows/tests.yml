name: tests

on:
  push:
  pull_request:

jobs:
  governor:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Governor test suite (stdlib only)
        run: python -m unittest discover -t . -s governor/tests -p "test_*.py"

  gatekeeper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gatekeeper deps
        run: pip install -r requirements.txt
      - name: Gatekeeper test suite
        run: python gatekeeper/test_gatekeeper.py

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
