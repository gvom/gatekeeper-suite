<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>initData test</title>
</head>
<body style="font-family: monospace; padding: 16px; word-break: break-all;">
<p id="status">Carregando...</p>
<textarea id="out" style="width:100%; height:200px;" readonly></textarea>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
  var tg = window.Telegram && window.Telegram.WebApp;
  var status = document.getElementById('status');
  var out = document.getElementById('out');
  if (tg && tg.initData) {
    tg.ready();
    status.textContent = 'initData (toque e segure para selecionar tudo, depois copie):';
    out.value = tg.initData;
  } else {
    status.textContent = 'Sem initData — abra esta pagina de dentro do Telegram (Mini App), nao no navegador comum.';
  }
</script>
</body>
</html>
